<svg
    xmlns="http://www.w3.org/2000/svg"
    class="guest-envelope-sheet guest-envelope-flap"
    viewBox="0 0 1200 800"
    preserveAspectRatio="xMidYMid meet"
    aria-hidden="true"
>
    <defs>
        <linearGradient id="envelope-flap-top" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="hsl(40 45% 96.7%)" />
            <stop offset="1" stop-color="hsl(40 34% 94%)" />
        </linearGradient>
        <filter id="envelope-flap-mottle" x="0" y="0" width="100%" height="100%">
            <feTurbulence
                type="fractalNoise"
                baseFrequency="0.012 0.024"
                numOctaves="4"
                seed="6"
                result="n"
            />
            <feColorMatrix
                in="n"
                type="matrix"
                values="0 0 0 0 0.32  0 0 0 0 0.28  0 0 0 0 0.22  0 0 0 0.06 0"
            />
        </filter>
        <filter id="envelope-flap-fibre" x="0" y="0" width="100%" height="100%">
            <feTurbulence
                type="fractalNoise"
                baseFrequency="0.006 0.09"
                numOctaves="2"
                seed="21"
                result="n"
            />
            <feColorMatrix
                in="n"
                type="matrix"
                values="0 0 0 0 0.30  0 0 0 0 0.27  0 0 0 0 0.22  0 0 0 0.03 0"
            />
        </filter>
        <clipPath id="envelope-flap-clip">
            <path d="M0 0 L1200 0 L600 430 Z" />
        </clipPath>
    </defs>

    <path d="M0 0 L1200 0 L600 430 Z" fill="url(#envelope-flap-top)" />
    <g clip-path="url(#envelope-flap-clip)">
        <rect
            x="0"
            y="0"
            width="1200"
            height="440"
            filter="url(#envelope-flap-mottle)"
            style="mix-blend-mode: multiply"
        />
        <rect
            x="0"
            y="0"
            width="1200"
            height="440"
            filter="url(#envelope-flap-fibre)"
            style="mix-blend-mode: multiply"
        />
    </g>
    <path
        d="M0 0 L600 430 L1200 0"
        fill="none"
        stroke="rgba(120,92,50,.16)"
        stroke-width="1.5"
    />
    <path
        d="M0 0 L600 430"
        stroke="rgba(255,255,255,.45)"
        stroke-width="1"
    />
    <path
        d="M1200 0 L600 430"
        stroke="rgba(255,255,255,.45)"
        stroke-width="1"
    />
</svg>
